<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --border: #E1E4EA;
    --border-strong: #C7CCD6;
    --ink: #171A22;
    --ink-soft: #5B6172;
    --ink-faint: #8A90A0;
    --accent: #0E6B5C;
    --accent-hover: #0A5548;
    --accent-soft: #E3F1EC;
    --danger: #C4362C;
    --danger-soft: #FBEAE8;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
    --shadow: 0 1px 2px rgba(20,23,31,0.04), 0 4px 14px rgba(20,23,31,0.05);
  }
  html.dark-mode{
    --bg: #1A1D23;
    --surface: #232930;
    --border: #36404D;
    --border-strong: #4A5463;
    --ink: #E8EAEF;
    --ink-soft: #A8B0C4;
    --ink-faint: #7A8298;
    --accent: #00B896;
    --accent-hover: #00A87F;
    --accent-soft: #0D3D31;
    --danger: #E85A52;
    --danger-soft: #4A2521;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.4);
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  button, input, textarea{ font-family:inherit; font-size:14px; }
  input, textarea{
    background:var(--surface); color:var(--ink); border:1px solid var(--border);
    border-radius:8px; padding:9px 12px;
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  input::placeholder, textarea::placeholder{ color:var(--ink-faint); }
  button{
    cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:9px 14px; font-weight:500; transition:background .12s, border-color .12s;
  }
  button:hover{ background:#FAFBFC; border-color:var(--border-strong); }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
  button.danger-ghost{ color:var(--danger); border-color:var(--border); background:var(--surface); }
  button.danger-ghost:hover{ background:var(--danger-soft); border-color:#EBB8B3; }
  button.subtle{ border-color:transparent; background:transparent; padding:6px 8px; font-weight:500; color:var(--ink-soft); }
  button.subtle:hover{ background:#EEF0F3; color:var(--ink); }
  button.icon-btn{ padding:6px 9px; font-size:13px; }

  /* ---------------- auth screens ---------------- */
  .center-screen{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-box{
    width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:32px; box-shadow:var(--shadow);
  }
  .auth-mark{
    width:40px; height:40px; border-radius:10px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; margin-bottom:18px;
  }
  .auth-box h1{ font-size:19px; font-weight:600; margin:0 0 6px; letter-spacing:-0.2px; }
  .auth-box .sub{ color:var(--ink-soft); font-size:13.5px; line-height:1.5; margin:0 0 22px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-bottom:6px; }
  .field input{ width:100%; }
  .row-btns{ margin-top:6px; }
  .row-btns button{ width:100%; padding:11px 14px; }
  .auth-error{
    color:var(--danger); font-size:13px; margin-top:12px; min-height:14px; line-height:1.4;
  }
  .switch-mode{ margin-top:18px; font-size:13px; color:var(--ink-soft); text-align:center; }
  .switch-mode button{ border:none; background:none; padding:0; font-weight:600; color:var(--accent); }
  .switch-mode button:hover{ background:none; text-decoration:underline; }

  /* ---------------- dashboard shell ---------------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 24px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:600; }
  .brand .mark{ width:26px; height:26px; border-radius:7px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  .brand .who{ color:var(--ink-faint); font-weight:500; }
  .layout{ flex:1; display:flex; min-height:0; }

  .sidebar{
    width:240px; border-right:1px solid var(--border); background:var(--surface);
    padding:18px 14px; overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column;
  }
  .sidebar h2{ font-size:11.5px; text-transform:none; color:var(--ink-faint); font-weight:600; margin:2px 8px 10px; }
  .section-item{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:9px 10px; margin-bottom:2px; cursor:pointer; border-radius:8px; font-size:14px; color:var(--ink-soft);
  }
  .section-item:hover{ background:#F2F3F6; color:var(--ink); }
  .section-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .section-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .section-item .del{ opacity:0; font-size:13px; color:var(--ink-faint); border:none; background:none; padding:2px 4px; line-height:1; }
  .section-item:hover .del{ opacity:1; }
  .section-item .del:hover{ color:var(--danger); }
  .add-section-form{ margin-top:10px; display:flex; gap:6px; }
  .add-section-form input{ flex:1; font-size:13px; padding:8px 10px; }
  .add-section-form button{ padding:8px 12px; font-size:13px; }
  .sidebar-footer{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); }
  .sidebar-footer button{ width:100%; }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .main-header{ padding:22px 28px 14px; }
  .main-header h1{ font-size:20px; font-weight:600; margin:0 0 2px; letter-spacing:-0.2px; }
  .main-header .count{ font-size:13px; color:var(--ink-faint); }
  .toolbar{ display:flex; gap:10px; padding:0 28px 16px; flex-wrap:wrap; }
  .toolbar input[type=text]{ flex:1; min-width:180px; }
  .entries{ flex:1; overflow-y:auto; padding:0 28px 28px; }

  .empty-state{
    color:var(--ink-soft); font-size:14px; border:1px dashed var(--border-strong); border-radius:12px;
    padding:32px 24px; text-align:center; line-height:1.6;
  }
  .empty-state code{ background:#EEF0F3; padding:2px 6px; border-radius:5px; font-family:var(--mono); font-size:12.5px; }

  .entry-card{
    border:1px solid var(--border); border-radius:12px; margin-bottom:10px; padding:16px 18px;
    background:var(--surface); box-shadow:var(--shadow);
  }
  .entry-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .entry-title{ font-size:15px; font-weight:600; }
  .entry-actions{ display:flex; gap:6px; }
  .entry-body{ margin-top:12px; display:grid; gap:9px; }
  .kv{ display:flex; gap:10px; align-items:center; }
  .kv .k{ color:var(--ink-faint); width:60px; flex-shrink:0; font-size:12.5px; font-weight:500; }
  .kv .v{ color:var(--ink); word-break:break-all; font-size:13.5px; }
  .kv .v.mono{ font-family:var(--mono); }
  .kv .v.masked{ letter-spacing:2px; color:var(--ink-soft); }
  .kv .actions{ display:flex; gap:4px; margin-left:auto; flex-shrink:0; }
  .kv .actions button{ font-size:12px; padding:4px 9px; }
  .notes-block{ font-size:13px; color:var(--ink-soft); white-space:pre-wrap; border-top:1px solid var(--border); padding-top:10px; margin-top:4px; line-height:1.5; }
  .notes-block .label{ display:block; font-size:12px; font-weight:600; color:var(--ink-faint); margin-bottom:3px; }

  .entry-form{
    border:1px solid var(--border-strong); border-radius:12px; padding:18px; margin-bottom:16px;
    background:var(--surface); box-shadow:var(--shadow);
  }
  .entry-form .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .entry-form .grid .full{ grid-column:1 / -1; }
  .entry-form label{ display:block; font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-bottom:5px; }
  .entry-form input, .entry-form textarea{ width:100%; }
  .entry-form textarea{ resize:vertical; min-height:60px; font-family:inherit; }
  .pass-row{ display:flex; gap:6px; }
  .pass-row input{ flex:1; font-family:var(--mono); }
  .form-btns{ display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); border-radius:10px;
    color:#fff; padding:11px 16px; font-size:13px; z-index:20; opacity:0; transform:translateY(6px);
    transition:opacity .2s, transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.18);
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  @media (max-width: 760px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border); max-height:220px; }
    .entry-form .grid{ grid-template-columns:1fr; }
    .kv{ flex-wrap:wrap; }
    .main-header, .toolbar, .entries{ padding-left:18px; padding-right:18px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     Crypto helpers — passphrase-derived AES-256-GCM
  ============================================================ */
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  function b64encode(buf){
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }
  function b64decode(str){
    const bin = atob(str);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function randomSaltB64(len){
    const arr = crypto.getRandomValues(new Uint8Array(len || 16));
    return b64encode(arr);
  }
  async function deriveKey(passphrase, saltB64){
    const salt = b64decode(saltB64);
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
      baseKey,
      { name:'AES-GCM', length:256 },
      false,
      ['encrypt','decrypt']
    );
  }
  async function encryptJSON(key, obj){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = enc.encode(JSON.stringify(obj));
    const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, data);
    return b64encode(iv) + '.' + b64encode(cipher);
  }
  async function decryptJSON(key, blob){
    const [ivB64, cipherB64] = blob.split('.');
    const iv = b64decode(ivB64);
    const cipher = b64decode(cipherB64);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipher);
    return JSON.parse(dec.decode(plain));
  }
  function genPassword(len){
    len = len || 20;
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-+=';
    const arr = crypto.getRandomValues(new Uint32Array(len));
    return Array.from(arr, n => chars[n % chars.length]).join('');
  }

  /* ============================================================
     Storage helpers (window.storage — personal, per-user)
  ============================================================ */
  async function storeGet(key){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value){
    try{ return await window.storage.set(key, value, false); } catch(e){ return null; }
  }
  async function storeDelete(key){
    try{ return await window.storage.delete(key, false); } catch(e){ return null; }
  }
  async function storeListKeys(prefix){
    try{ const r = await window.storage.list(prefix, false); return r ? r.keys : []; }
    catch(e){ return []; }
  }

  /* ============================================================
     App state
  ============================================================ */
  const state = {
    screen: 'loading',       // loading | signup | login | dashboard
    authError: '',
    cryptoKey: null,
    username: '',
    sections: [],
    activeSectionId: null,
    entriesCache: {},
    searchTerm: '',
    addingEntry: false,
    editingEntryId: null,
    revealedPasswords: {},
  };

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove('show'), 1900);
  }

  const app = document.getElementById('app');

  async function init(){
    const darkMode = localStorage.getItem('vault:dark-mode') === 'true';
    if(darkMode) document.documentElement.classList.add('dark-mode');
    const meta = await storeGet('vault:meta');
    if(meta){
      try{ state.username = JSON.parse(meta).username; state.screen = 'login'; }
      catch(e){ state.screen = 'signup'; }
    } else {
      state.screen = 'signup';
    }
    render();
  }

  /* ============================================================
     Auth actions
  ============================================================ */
  async function handleSignup(username, passphrase, confirmPass){
    state.authError = '';
    if(!username.trim() || !passphrase){ state.authError = 'Enter a username and a passphrase.'; return render(); }
    if(passphrase.length < 6){ state.authError = 'Passphrase should be at least 6 characters.'; return render(); }
    if(passphrase !== confirmPass){ state.authError = 'Passphrases don\u2019t match.'; return render(); }

    const salt = randomSaltB64(16);
    const key = await deriveKey(passphrase, salt);
    const encIndex = await encryptJSON(key, { sections: [] });
    await storeSet('vault:meta', JSON.stringify({ username: username.trim(), salt }));
    await storeSet('vault:index', encIndex);
    state.cryptoKey = key;
    state.username = username.trim();
    state.sections = [];
    state.screen = 'dashboard';
    render();
    showToast('Vault created');
  }

  async function handleLogin(username, passphrase){
    state.authError = '';
    const metaRaw = await storeGet('vault:meta');
    if(!metaRaw){ state.authError = 'No vault found yet.'; return render(); }
    const meta = JSON.parse(metaRaw);
    if(username.trim().toLowerCase() !== meta.username.toLowerCase()){
      state.authError = 'That username doesn\u2019t match this vault.';
      return render();
    }
    try{
      const key = await deriveKey(passphrase, meta.salt);
      const encIndex = await storeGet('vault:index');
      const index = await decryptJSON(key, encIndex);
      state.cryptoKey = key;
      state.username = meta.username;
      state.sections = index.sections || [];
      state.activeSectionId = state.sections[0] ? state.sections[0].id : null;
      state.screen = 'dashboard';
      render();
    } catch(e){
      state.authError = 'Incorrect passphrase.';
      render();
    }
  }

  function handleLogout(){
    state.cryptoKey = null;
    state.sections = [];
    state.entriesCache = {};
    state.activeSectionId = null;
    state.screen = 'login';
    render();
  }

  async function handleWipe(){
    if(!confirm('This permanently deletes your entire vault — every section and entry. This cannot be undone. Continue?')) return;
    const keys = await storeListKeys('vault:');
    for(const k of keys){ await storeDelete(k); }
    await storeDelete('vault:meta');
    await storeDelete('vault:index');
    state.cryptoKey = null; state.sections = []; state.entriesCache = {};
    state.activeSectionId = null; state.screen = 'signup';
    render();
    showToast('Vault deleted');
  }

  /* ============================================================
     Index (sections) & entries persistence
  ============================================================ */
  async function saveIndex(){
    const blob = await encryptJSON(state.cryptoKey, { sections: state.sections });
    await storeSet('vault:index', blob);
  }
  async function saveEntries(sectionId){
    const list = state.entriesCache[sectionId] || [];
    const blob = await encryptJSON(state.cryptoKey, list);
    await storeSet('vault:entries:' + sectionId, blob);
  }
  async function loadEntries(sectionId){
    if(state.entriesCache[sectionId]) return state.entriesCache[sectionId];
    const raw = await storeGet('vault:entries:' + sectionId);
    let list = [];
    if(raw){ try{ list = await decryptJSON(state.cryptoKey, raw); } catch(e){ list = []; } }
    state.entriesCache[sectionId] = list;
    return list;
  }

  async function addSection(name){
    name = (name || '').trim();
    if(!name) return;
    const id = 's_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    state.sections.push({ id, name });
    state.entriesCache[id] = [];
    state.activeSectionId = id;
    await saveIndex();
    await saveEntries(id);
    render();
  }
  async function deleteSection(id){
    state.sections = state.sections.filter(s => s.id !== id);
    delete state.entriesCache[id];
    await storeDelete('vault:entries:' + id);
    await saveIndex();
    if(state.activeSectionId === id){
      state.activeSectionId = state.sections[0] ? state.sections[0].id : null;
    }
    render();
  }

  async function addEntry(sectionId, data){
    const list = await loadEntries(sectionId);
    list.push({ id: 'e_' + Date.now() + '_' + Math.floor(Math.random()*1000), ...data });
    state.entriesCache[sectionId] = list;
    await saveEntries(sectionId);
    state.addingEntry = false;
    render();
    showToast('Entry added');
  }
  async function updateEntry(sectionId, entryId, data){
    const list = await loadEntries(sectionId);
    const idx = list.findIndex(e => e.id === entryId);
    if(idx === -1) return;
    list[idx] = Object.assign({}, list[idx], data);
    state.entriesCache[sectionId] = list;
    await saveEntries(sectionId);
    state.editingEntryId = null;
    render();
    showToast('Changes saved');
  }
  async function deleteEntry(sectionId, entryId){
    const list = await loadEntries(sectionId);
    state.entriesCache[sectionId] = list.filter(e => e.id !== entryId);
    await saveEntries(sectionId);
    render();
    showToast('Entry deleted');
  }

  async function copyToClipboard(text, label){
    try{ await navigator.clipboard.writeText(text || ''); showToast((label || 'Value') + ' copied'); }
    catch(e){ showToast('Couldn\u2019t access clipboard'); }
  }

  /* ============================================================
     Rendering
  ============================================================ */
  function el(html){
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function escapeHTML(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(str){ return escapeHTML(str); }

  function render(){
    if(state.screen === 'loading') return renderLoading();
    if(state.screen === 'signup') return renderAuth('signup');
    if(state.screen === 'login') return renderAuth('login');
    if(state.screen === 'dashboard') return renderDashboard();
  }

  function renderLoading(){
    app.innerHTML = '<div class="center-screen"><div style="color:var(--ink-faint);font-size:14px;">Loading\u2026</div></div>';
  }

  function renderAuth(mode){
    const isSignup = mode === 'signup';
    app.innerHTML = `
      <div class="center-screen">
        <div class="auth-box">
          <div class="auth-mark">V</div>
          <h1>${isSignup ? 'Create your vault' : 'Welcome back'}</h1>
          <p class="sub">${isSignup
            ? 'Your accounts are encrypted with a key made from your passphrase. It never leaves this device \u2014 and if you forget it, the data can\u2019t be recovered.'
            : 'Enter your passphrase to unlock your vault.'}</p>
          <form id="auth-form">
            <div class="field">
              <label for="auth-username">Username</label>
              <input id="auth-username" type="text" autocomplete="username" placeholder="e.g. alex" required />
            </div>
            <div class="field">
              <label for="auth-pass">Passphrase</label>
              <input id="auth-pass" type="password" autocomplete="${isSignup ? 'new-password' : 'current-password'}" placeholder="At least 6 characters" required />
            </div>
            ${isSignup ? `
            <div class="field">
              <label for="auth-pass2">Confirm passphrase</label>
              <input id="auth-pass2" type="password" autocomplete="new-password" placeholder="Re-enter passphrase" required />
            </div>` : ''}
            <div class="row-btns">
              <button type="submit" class="primary">${isSignup ? 'Create vault' : 'Unlock vault'}</button>
            </div>
            <div class="auth-error">${state.authError || ''}</div>
          </form>
          <div class="switch-mode">
            ${isSignup
              ? `Already have a vault? <button id="switch-link">Log in</button>`
              : `New here? <button id="switch-link">Create a vault</button>`}
          </div>
        </div>
      </div>
    `;
    document.getElementById('auth-form').addEventListener('submit', (e)=>{
      e.preventDefault();
      const username = document.getElementById('auth-username').value;
      const pass = document.getElementById('auth-pass').value;
      if(isSignup){
        handleSignup(username, pass, document.getElementById('auth-pass2').value);
      } else {
        handleLogin(username, pass);
      }
    });
    document.getElementById('switch-link').addEventListener('click', ()=>{
      state.authError = '';
      state.screen = isSignup ? 'login' : 'signup';
      render();
    });
  }

  function maskPassword(pw){ return '\u2022'.repeat(Math.min((pw||'').length, 20) || 8); }

  function entryCardHTML(entry, sectionId){
    if(state.editingEntryId === entry.id) return entryFormHTML(sectionId, entry);
    const revealed = !!state.revealedPasswords[entry.id];
    return `
      <div class="entry-card" data-entry-id="${entry.id}">
        <div class="entry-head">
          <div class="entry-title">${escapeHTML(entry.label)}</div>
          <div class="entry-actions">
            <button class="icon-btn subtle" data-action="edit" data-id="${entry.id}">Edit</button>
            <button class="icon-btn danger-ghost" data-action="delete" data-id="${entry.id}">Delete</button>
          </div>
        </div>
        <div class="entry-body">
          ${entry.username ? `
          <div class="kv">
            <span class="k">Login</span><span class="v">${escapeHTML(entry.username)}</span>
            <span class="actions"><button data-action="copy" data-value="username" data-id="${entry.id}">Copy</button></span>
          </div>` : ''}
          ${entry.password ? `
          <div class="kv">
            <span class="k">Password</span>
            <span class="v mono ${revealed ? '' : 'masked'}">${revealed ? escapeHTML(entry.password) : maskPassword(entry.password)}</span>
            <span class="actions">
              <button data-action="reveal" data-id="${entry.id}">${revealed ? 'Hide' : 'Reveal'}</button>
              <button data-action="copy" data-value="password" data-id="${entry.id}">Copy</button>
            </span>
          </div>` : ''}
          ${entry.twofa ? `<div class="notes-block"><span class="label">2FA / recovery codes</span>${escapeHTML(entry.twofa)}</div>` : ''}
          ${entry.notes ? `<div class="notes-block"><span class="label">Notes</span>${escapeHTML(entry.notes)}</div>` : ''}
        </div>
      </div>
    `;
  }

  function entryFormHTML(sectionId, existing){
    const isEdit = !!existing;
    return `
      <div class="entry-form" data-form-for="${isEdit ? existing.id : 'new'}">
        <div class="grid">
          <div class="full">
            <label>Service / label</label>
            <input type="text" id="f-label" placeholder="e.g. Discord \u2014 main account" value="${isEdit ? escapeAttr(existing.label) : ''}" />
          </div>
          <div>
            <label>Username / email</label>
            <input type="text" id="f-username" placeholder="e.g. alex#0001" value="${isEdit ? escapeAttr(existing.username||'') : ''}" />
          </div>
          <div>
            <label>Password</label>
            <div class="pass-row">
              <input type="text" id="f-password" placeholder="Password" value="${isEdit ? escapeAttr(existing.password||'') : ''}" />
              <button type="button" id="f-gen">Generate</button>
            </div>
          </div>
          <div class="full">
            <label>2FA / recovery codes</label>
            <textarea id="f-twofa" placeholder="Backup codes, TOTP secret, etc.">${isEdit ? escapeHTML(existing.twofa||'') : ''}</textarea>
          </div>
          <div class="full">
            <label>Notes</label>
            <textarea id="f-notes" placeholder="Anything else worth remembering">${isEdit ? escapeHTML(existing.notes||'') : ''}</textarea>
          </div>
        </div>
        <div class="form-btns">
          <button id="f-cancel">Cancel</button>
          <button id="f-save" class="primary">${isEdit ? 'Save changes' : 'Add entry'}</button>
        </div>
      </div>
    `;
  }

  async function renderDashboard(){
    const activeSection = state.sections.find(s => s.id === state.activeSectionId);
    let entries = [];
    if(activeSection) entries = await loadEntries(activeSection.id);
    const term = state.searchTerm.toLowerCase();
    const filtered = term
      ? entries.filter(e => (e.label+' '+(e.username||'')).toLowerCase().includes(term))
      : entries;

    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="mark">V</span> Vault <span class="who">\u2013 ${escapeHTML(state.username)}</span></div>
        <div style="display:flex; gap:10px;"><button id="btn-dark-toggle" class="icon-btn subtle" title="Toggle dark mode">🌙</button><button id="btn-lock">Lock vault</button></div>
      </div>
      <div class="layout">
        <div class="sidebar">
          <h2>Sections</h2>
          <div id="section-list"></div>
          <form class="add-section-form" id="add-section-form">
            <input type="text" id="new-section-name" placeholder="New section" />
            <button type="submit">Add</button>
          </form>
          <div class="sidebar-footer">
            <button id="btn-wipe" class="danger-ghost">Delete vault</button>
          </div>
        </div>
        <div class="main">
          ${activeSection ? `
            <div class="main-header">
              <h1>${escapeHTML(activeSection.name)}</h1>
              <div class="count">${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}</div>
            </div>
            <div class="toolbar">
              <input type="text" id="search-input" placeholder="Search this section..." value="${escapeAttr(state.searchTerm)}" />
              <button id="btn-add-entry" class="primary">+ Add entry</button>
            </div>
            <div class="entries" id="entries-container"></div>
          ` : `
            <div class="main-header"><h1>No sections yet</h1></div>
            <div style="padding:0 28px 28px;">
              <div class="empty-state">Create a section on the left to start organizing accounts \u2014 for example <code>Discord</code>, <code>Minecraft</code>, or <code>YouTube</code>.</div>
            </div>
          `}
        </div>
      </div>
    `;

    const sectionList = document.getElementById('section-list');
    state.sections.forEach(sec => {
      const item = el(`
        <div class="section-item ${sec.id === state.activeSectionId ? 'active' : ''}" data-id="${sec.id}">
          <span class="name">${escapeHTML(sec.name)}</span>
          <button class="del" data-id="${sec.id}" title="Delete section" aria-label="Delete section">\u00d7</button>
        </div>
      `);
      item.addEventListener('click', (e)=>{
        if(e.target.classList.contains('del')) return;
        state.activeSectionId = sec.id;
        state.addingEntry = false;
        state.editingEntryId = null;
        render();
      });
      item.querySelector('.del').addEventListener('click', (e)=>{
        e.stopPropagation();
        if(confirm("Delete section \u2018" + sec.name + "\u2019 and all its entries?")) deleteSection(sec.id);
      });
      sectionList.appendChild(item);
    });

    document.getElementById('add-section-form').addEventListener('submit', (e)=>{
      e.preventDefault();
      const input = document.getElementById('new-section-name');
      addSection(input.value);
      input.value = '';
    });
    document.getElementById('btn-lock').addEventListener('click', handleLogout);
    document.getElementById('btn-wipe').addEventListener('click', handleWipe);
    document.getElementById('btn-dark-toggle').addEventListener('click', ()=>{
      document.documentElement.classList.toggle('dark-mode');
      const isDark = document.documentElement.classList.contains('dark-mode');
      localStorage.setItem('vault:dark-mode', isDark ? 'true' : 'false');
    });

    if(activeSection){
      const container = document.getElementById('entries-container');
      if(state.addingEntry){
        container.appendChild(el(entryFormHTML(activeSection.id, null)));
        wireEntryForm(activeSection.id, null, container.querySelector('[data-form-for="new"]'));
      }
      if(filtered.length === 0 && !state.addingEntry){
        container.appendChild(el(`<div class="empty-state">No entries here yet. Click \u201cAdd entry\u201d to store your first account.</div>`));
      }
      filtered.forEach(entry => {
        const node = el(entryCardHTML(entry, activeSection.id));
        container.appendChild(node);
        if(state.editingEntryId === entry.id){
          wireEntryForm(activeSection.id, entry, node);
        } else {
          node.querySelectorAll('button[data-action]').forEach(btn => {
            btn.addEventListener('click', ()=> handleEntryAction(btn, activeSection.id, entry));
          });
        }
      });

      document.getElementById('btn-add-entry').addEventListener('click', ()=>{
        state.addingEntry = !state.addingEntry;
        state.editingEntryId = null;
        render();
      });
      document.getElementById('search-input').addEventListener('input', (e)=>{
        state.searchTerm = e.target.value;
        render();
      });
    }
  }

  function handleEntryAction(btn, sectionId, entry){
    const action = btn.dataset.action;
    if(action === 'edit'){ state.editingEntryId = entry.id; render(); }
    else if(action === 'delete'){ if(confirm("Delete entry \u2018" + entry.label + "\u2019?")) deleteEntry(sectionId, entry.id); }
    else if(action === 'reveal'){ state.revealedPasswords[entry.id] = !state.revealedPasswords[entry.id]; render(); }
    else if(action === 'copy'){ copyToClipboard(entry[btn.dataset.value] || '', btn.dataset.value === 'password' ? 'Password' : 'Username'); }
  }

  function wireEntryForm(sectionId, existing, node){
    node.querySelector('#f-gen').addEventListener('click', ()=>{
      node.querySelector('#f-password').value = genPassword(20);
    });
    node.querySelector('#f-cancel').addEventListener('click', ()=>{
      state.addingEntry = false;
      state.editingEntryId = null;
      render();
    });
    node.querySelector('#f-save').addEventListener('click', ()=>{
      const data = {
        label: node.querySelector('#f-label').value.trim() || 'Untitled',
        username: node.querySelector('#f-username').value.trim(),
        password: node.querySelector('#f-password').value,
        twofa: node.querySelector('#f-twofa').value.trim(),
        notes: node.querySelector('#f-notes').value.trim(),
      };
      if(existing) updateEntry(sectionId, existing.id, data);
      else addEntry(sectionId, data);
    });
  }

  init();
})();
</script>
</body>
</html>
